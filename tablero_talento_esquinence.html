<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tablero Talento Esquinence — CEM</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Barlow', sans-serif;
    background: #F4F7FA;
    color: #1A2D3D;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  .cem-header {
    background: #0F2744;
    padding: 16px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .cem-header .titulo {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 22px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #fff;
  }
  .cem-header .titulo span { color: #3AAEE0; }
  .cem-header .subtitulo {
    font-size: 11px;
    color: rgba(255,255,255,0.5);
    margin-top: 2px;
    font-weight: 400;
  }
  .cem-header .acciones { display: flex; align-items: center; gap: 12px; }
  .btn-refresh {
    background: #1A3D5C;
    border: none;
    color: #3AAEE0;
    font-family: 'Barlow', sans-serif;
    font-weight: 700;
    font-size: 11px;
    padding: 8px 18px;
    border-radius: 4px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    transition: background 0.15s;
  }
  .btn-refresh:hover { background: #3AAEE0; color: #0F2744; }
  .ultima-act {
    font-size: 11px;
    color: rgba(255,255,255,0.4);
  }

  /* ── LAYOUT ── */
  .contenido { padding: 20px 28px 32px; }

  /* ── MÉTRICAS ── */
  .metricas {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 16px;
  }
  .metrica {
    background: #fff;
    border: 1px solid #C8D6E2;
    border-top: 3px solid #3AAEE0;
    border-radius: 6px;
    padding: 16px 18px;
  }
  .metrica .label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #5A7387;
    margin-bottom: 8px;
  }
  .metrica .valor {
    font-family: 'DM Mono', monospace;
    font-weight: 500;
    font-size: 32px;
    color: #0F2744;
    line-height: 1;
  }
  .metrica .sub {
    font-size: 11px;
    color: #5A7387;
    margin-top: 4px;
  }

  /* ── GRILLAS ── */
  .fila-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .fila-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 12px; }

  /* ── CARDS ── */
  .card {
    background: #fff;
    border: 1px solid #C8D6E2;
    border-radius: 6px;
    padding: 16px 18px;
  }
  .card-titulo {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #1B7DB5;
    border-bottom: 1px solid #E8EEF4;
    padding-bottom: 9px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .area-badge {
    font-size: 9px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 3px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* ── BARRAS ── */
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
  .bar-label { font-size: 12px; font-weight: 600; color: #1A2D3D; min-width: 130px; text-align: right; }
  .bar-track { flex: 1; background: #E8EEF4; border-radius: 3px; height: 20px; overflow: hidden; }
  .bar-fill {
    height: 100%; border-radius: 3px;
    display: flex; align-items: center; justify-content: flex-end;
    padding-right: 7px; min-width: 28px;
    transition: width 0.7s cubic-bezier(.4,0,.2,1);
  }
  .bar-fill span { font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500; color: #fff; }

  /* ── TABLA INSCRIPTOS ── */
  .lista-scroll { max-height: 280px; overflow-y: auto; }
  .inscripto-row {
    display: flex; align-items: center; gap: 12px;
    padding: 9px 0; border-bottom: 0.5px solid #E8EEF4;
  }
  .inscripto-row:last-child { border-bottom: none; }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: #E8EEF4; display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: #1B7DB5; flex-shrink: 0;
  }
  .inscripto-nombre { font-size: 13px; font-weight: 600; color: #1A2D3D; }
  .inscripto-detalle { font-size: 11px; color: #5A7387; margin-top: 1px; }
  .nivel-pill {
    font-size: 10px; font-weight: 700; padding: 3px 9px;
    border-radius: 10px; text-transform: uppercase;
    letter-spacing: 0.04em; margin-left: auto; flex-shrink: 0;
    white-space: nowrap;
  }

  /* ── ESTADO ── */
  .estado { text-align: center; padding: 3rem; color: #5A7387; font-size: 14px; }
  .error { color: #E05C4A; }

  /* ── FOOTER ── */
  .cem-footer {
    background: #E8EEF4;
    border-top: 1px solid #C8D6E2;
    padding: 10px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    color: #5A7387;
  }
  .cem-badge {
    background: #0F2744; color: #3AAEE0;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800; font-size: 10px;
    letter-spacing: 0.08em; text-transform: uppercase;
    padding: 3px 10px; border-radius: 3px;
  }

  @media (max-width: 900px) {
    .metricas { grid-template-columns: repeat(2, 1fr); }
    .fila-2, .fila-3 { grid-template-columns: 1fr; }
    .contenido { padding: 16px; }
    .cem-header { padding: 14px 16px; }
    .cem-footer { padding: 10px 16px; }
  }
</style>
</head>
<body>

<div class="cem-header">
  <div>
    <div class="titulo">Talento <span>Esquinence</span></div>
    <div class="subtitulo">Tablero de relevamiento · Dirección de Cultura · Municipio de Esquina</div>
  </div>
  <div class="acciones">
    <span class="ultima-act" id="ultima-act">—</span>
    <button class="btn-refresh" onclick="cargarDatos()">↺ Actualizar</button>
  </div>
</div>

<div class="contenido" id="contenido">
  <div class="estado">Cargando datos del relevamiento...</div>
</div>

<div class="cem-footer">
  <span>Datos en tiempo real · Google Sheets · Relevamiento Talento Esquinence 2025</span>
  <span class="cem-badge">CEM · Centro de Estadística Municipal</span>
</div>

<script>
const SHEET_ID = "11huZYGCAY3SUFxBW_PBslGkk0dfs4rlWKFB4p9caQD8";
const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Respuestas`;

const DISC_COLOR = {
  canto:"#3AAEE0", instrumentos:"#6CBF6A", banda:"#F5C842",
  danza:"#E8834A", teatro:"#8B6FD4", escritura:"#5BAD8F",
  "artes_visuales":"#D4934A", artesania:"#5B8DB8", murga:"#E05C4A",
  folklore:"#1B7DB5", otra:"#888780"
};
const NIV_COLOR = { iniciando:"#6CBF6A", desarrollo:"#F5C842", trayectoria:"#3AAEE0" };
const NIV_LABEL = { iniciando:"Iniciando", desarrollo:"En desarrollo", trayectoria:"Con trayectoria" };

let charts = {};
function destroyChart(id) {
  if (charts[id]) { charts[id].destroy(); delete charts[id]; }
}

function cargarDatos() {
  document.getElementById("contenido").innerHTML = '<div class="estado">Actualizando...</div>';
  fetch(URL)
    .then(r => r.text())
    .then(txt => {
      const json = JSON.parse(txt.replace(/^[^(]+\(/, "").replace(/\);?\s*$/, ""));
      const rows = json.table.rows;
      if (!rows || rows.length === 0) {
        document.getElementById("contenido").innerHTML =
          '<div class="estado">No hay respuestas aún. El tablero se actualizará cuando lleguen inscripciones.</div>';
        return;
      }
      const datos = rows.map(r => ({
        fecha:       r.c[0]  ? r.c[0].v  : "",
        nombre:      r.c[1]  ? r.c[1].v  : "",
        edad:        r.c[3]  ? parseInt(r.c[3].v) : null,
        barrio:      r.c[6]  ? r.c[6].v  : "",
        disciplinas: r.c[7]  ? r.c[7].v.split(",").map(d => d.trim().toLowerCase()) : [],
        nivel:       r.c[23] ? r.c[23].v : "",
        dispFest:    r.c[25] ? r.c[25].v === "Sí" : false,
        dispTall:    r.c[26] ? r.c[26].v === "Sí" : false,
        dispVid:     r.c[27] ? r.c[27].v === "Sí" : false,
        dispEsc:     r.c[28] ? r.c[28].v === "Sí" : false,
        instagram:   r.c[29] ? r.c[29].v : "",
        danzaRol:    r.c[10] ? r.c[10].v : "",
        danzaGeneros:r.c[13] ? r.c[13].v : "",
      }));
      renderTablero(datos);
      document.getElementById("ultima-act").textContent =
        "Actualizado: " + new Date().toLocaleString("es-AR", { dateStyle:"short", timeStyle:"short" });
    })
    .catch(() => {
      document.getElementById("contenido").innerHTML =
        '<div class="estado error">No se pudo conectar con el Sheet.<br>Verificá que el archivo sea público ("Cualquier persona con el enlace puede ver").</div>';
    });
}

function renderTablero(datos) {
  const total = datos.length;

  const discConteo = {};
  datos.forEach(d => d.disciplinas.forEach(disc => {
    if (disc) discConteo[disc] = (discConteo[disc] || 0) + 1;
  }));
  const discOrdenado = Object.entries(discConteo).sort((a,b) => b[1]-a[1]);

  const nivConteo = {};
  datos.forEach(d => { if (d.nivel) nivConteo[d.nivel] = (nivConteo[d.nivel] || 0) + 1; });

  const edades = datos.filter(d => d.edad && d.edad > 0).map(d => d.edad);
  const edadProm = edades.length ? Math.round(edades.reduce((a,b) => a+b,0)/edades.length) : "—";

  const conDanza = datos.filter(d => d.disciplinas.includes("danza")).length;
  const conInst  = datos.filter(d => d.instagram).length;

  const dispFest = datos.filter(d => d.dispFest).length;
  const dispTall = datos.filter(d => d.dispTall).length;
  const dispVid  = datos.filter(d => d.dispVid).length;
  const dispEsc  = datos.filter(d => d.dispEsc).length;

  document.getElementById("contenido").innerHTML = `
    <div class="metricas">
      <div class="metrica">
        <div class="label">Total inscriptos</div>
        <div class="valor">${total}</div>
        <div class="sub">respuestas recibidas</div>
      </div>
      <div class="metrica" style="border-top-color:#6CBF6A">
        <div class="label">Disciplinas</div>
        <div class="valor">${Object.keys(discConteo).length}</div>
        <div class="sub">expresiones distintas</div>
      </div>
      <div class="metrica" style="border-top-color:#F5C842">
        <div class="label">Edad promedio</div>
        <div class="valor">${edadProm}</div>
        <div class="sub">años</div>
      </div>
      <div class="metrica" style="border-top-color:#E8834A">
        <div class="label">Bailarines/as</div>
        <div class="valor">${conDanza}</div>
        <div class="sub">seleccionaron danza</div>
      </div>
    </div>

    <div class="fila-2">
      <div class="card">
        <div class="card-titulo">
          Disciplinas artísticas
          <span class="area-badge" style="background:#E8EEF4;color:#1B7DB5">distribución</span>
        </div>
        ${discOrdenado.map(([d,n]) => `
          <div class="bar-row">
            <div class="bar-label">${d.charAt(0).toUpperCase()+d.slice(1).replace("_"," ")}</div>
            <div class="bar-track">
              <div class="bar-fill" style="width:${Math.round(n/total*100)}%;background:${DISC_COLOR[d]||'#888'}">
                <span>${n}</span>
              </div>
            </div>
          </div>`).join("")}
      </div>

      <div class="card">
        <div class="card-titulo">Trayectoria</div>
        <div style="position:relative;height:200px;">
          <canvas id="chartNivel" role="img" aria-label="Gráfico de dona mostrando niveles de trayectoria de los inscriptos">
            ${Object.entries(nivConteo).map(([k,v]) => `${NIV_LABEL[k]||k}: ${v}`).join(", ")}
          </canvas>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;">
          ${Object.entries(nivConteo).map(([k,v]) => `
            <span style="display:flex;align-items:center;gap:6px;font-size:12px;color:#5A7387;">
              <span style="width:10px;height:10px;border-radius:2px;background:${NIV_COLOR[k]||'#888'};display:inline-block;flex-shrink:0"></span>
              ${NIV_LABEL[k]||k}: <strong style="color:#1A2D3D;margin-left:2px">${v}</strong>
            </span>`).join("")}
        </div>
      </div>
    </div>

    <div class="fila-2">
      <div class="card">
        <div class="card-titulo">
          Disponibilidad
          <span class="area-badge" style="background:#EBF7EB;color:#3B6D11">capacidad instalada</span>
        </div>
        ${[
          ["Festivales y eventos", dispFest, "#3AAEE0"],
          ["Talleres comunitarios", dispTall, "#6CBF6A"],
          ["Video testimonial",    dispVid,  "#E8834A"],
          ["Visitas a escuelas",   dispEsc,  "#8B6FD4"]
        ].map(([label,n,color]) => `
          <div class="bar-row">
            <div class="bar-label" style="font-size:11.5px">${label}</div>
            <div class="bar-track">
              <div class="bar-fill" style="width:${total?Math.round(n/total*100):0}%;background:${color}">
                <span>${n}</span>
              </div>
            </div>
          </div>`).join("")}
        <div style="margin-top:14px;padding-top:12px;border-top:1px solid #E8EEF4;font-size:11px;color:#5A7387;">
          Con presencia en redes: <strong style="color:#1A2D3D">${conInst}</strong> de ${total} inscriptos
        </div>
      </div>

      <div class="card">
        <div class="card-titulo">Últimas inscripciones</div>
        <div class="lista-scroll">
          ${datos.slice().reverse().slice(0,10).map(d => {
            const ini = d.nombre.split(" ").map(p=>p[0]).join("").substring(0,2).toUpperCase();
            const disc = d.disciplinas.slice(0,2).map(d=>d.charAt(0).toUpperCase()+d.slice(1).replace("_"," ")).join(", ");
            const niv = d.nivel || "";
            const nc = NIV_COLOR[niv] || "#888";
            return `
            <div class="inscripto-row">
              <div class="avatar">${ini||"?"}</div>
              <div>
                <div class="inscripto-nombre">${d.nombre||"—"}</div>
                <div class="inscripto-detalle">${disc||"sin disciplina"}${d.barrio ? " · "+d.barrio : ""}</div>
              </div>
              <div class="nivel-pill" style="background:${nc}20;color:${nc}">${NIV_LABEL[niv]||niv||"—"}</div>
            </div>`;
          }).join("")}
        </div>
      </div>
    </div>
  `;

  destroyChart("chartNivel");
  const ctx = document.getElementById("chartNivel");
  if (ctx && Object.keys(nivConteo).length > 0) {
    charts["chartNivel"] = new Chart(ctx, {
      type: "doughnut",
      data: {
        labels: Object.keys(nivConteo).map(k => NIV_LABEL[k]||k),
        datasets: [{
          data: Object.values(nivConteo),
          backgroundColor: Object.keys(nivConteo).map(k => NIV_COLOR[k]||"#888"),
          borderWidth: 3, borderColor: "#fff"
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        cutout: "68%"
      }
    });
  }
}

cargarDatos();
</script>
</body>
</html>
